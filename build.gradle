// Labtrace Android App - build.gradle (Module: app)

plugins {
    id 'com.android.application' version '9.2.1'
}

android {
    namespace 'com.labtrace.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.labtrace.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
}
