<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Content Security Policy: restrict resource loading for XSS mitigation -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: file:;
                   script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net;
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: blob: file: https:;
                   connect-src 'self' https://cdn.jsdelivr.net;
                   object-src 'self' blob: data:;">
    <meta name="referrer" content="no-referrer">
    <title>Labtrace - 检查单数据管理</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Load libraries: local assets for offline, CDN as fallback -->
    <!-- sql.js: local first, CDN fallback via document.write -->
    <script src="js/sql.js/sql-wasm.js"></script>
    <script>if (typeof initSqlJs === 'undefined') { document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"><\/scr' + 'ipt>'); }</script>
    <!-- chart.js & JSZip: defer ensures execution before app scripts but after DOM parse -->
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
    <!-- Loading indicator shown until app initializes -->
    <div id="app-loading" class="app-loading">
        <div class="loading-spinner"></div>
        <p>正在加载 Labtrace...</p>
    </div>

    <div id="app" style="display:none">
        <!-- 顶部导航 -->
        <header class="app-header">
            <h1>Labtrace</h1>
            <div class="header-actions">
                <button id="btn-import" class="icon-btn" data-action="import" title="导入数据" aria-label="导入数据">📥</button>
                <button id="btn-settings" class="icon-btn" data-action="settings" title="设置" aria-label="设置">⚙️</button>
            </div>
        </header>

        <!-- 标签页导航 -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="reports">📋 报告</button>
            <button class="tab-btn" data-tab="trends">📈 趋势</button>
            <button class="tab-btn" data-tab="search">🔍 检索</button>
            <button class="tab-btn" data-tab="stats">📊 统计</button>
        </nav>

        <!-- 报告列表页 -->
        <div id="tab-reports" class="tab-content active">
            <div class="filter-bar">
                <select id="filter-subject">
                    <option value="">全部受检者</option>
                </select>
                <select id="filter-hospital">
                    <option value="">全部医院</option>
                </select>
                <select id="filter-category">
                    <option value="">全部类别</option>
                </select>
            </div>
            <div id="reports-list" class="card-list"></div>
        </div>

        <!-- 趋势分析页 -->
        <div id="tab-trends" class="tab-content">
            <div class="filter-bar">
                <select id="trend-subject">
                    <option value="">选择受检者</option>
                </select>
                <select id="trend-item">
                    <option value="">选择指标</option>
                </select>
            </div>
            <div id="trend-chart-container">
                <canvas id="trend-chart"></canvas>
            </div>
            <div id="trend-data" class="data-table"></div>
        </div>

        <!-- 数据检索页 -->
        <div id="tab-search" class="tab-content">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="搜索指标名称、医院、日期..." aria-label="搜索">
                <button id="btn-search" data-action="search">搜索</button>
            </div>
            <div class="filter-bar">
                <input type="date" id="search-date-from" placeholder="开始日期" aria-label="开始日期">
                <input type="date" id="search-date-to" placeholder="结束日期" aria-label="结束日期">
            </div>
            <div id="search-results" class="card-list"></div>
        </div>

        <!-- 统计分析页 -->
        <div id="tab-stats" class="tab-content">
            <div class="filter-bar">
                <select id="stats-subject">
                    <option value="">选择受检者</option>
                </select>
            </div>
            <div id="stats-overview" class="stats-grid"></div>
            <div id="stats-abnormal" class="card-list"></div>
        </div>
    </div>

    <!-- Noscript fallback -->
    <noscript>
        <div class="noscript-message">
            <p>Labtrace 需要 JavaScript 才能运行。请在浏览器设置中启用 JavaScript。</p>
        </div>
    </noscript>

    <!-- 导入数据弹窗 -->
    <div id="import-modal" class="modal" role="dialog" aria-labelledby="import-modal-title">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="import-modal-title">导入数据</h3>
                <button class="close-btn" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <div class="import-section">
                    <h4>📦 从备份文件恢复</h4>
                    <input type="file" id="import-backup" accept=".zip">
                    <p class="hint">选择备份压缩包（.zip），将恢复数据库及所有关联的 PDF / 图片文件</p>
                </div>
                <div class="import-section" style="border-top:1px solid var(--border);padding-top:12px;margin-top:12px">
                    <h4>📄 高级：单独导入</h4>
                    <div style="margin-bottom:8px">
                        <label for="import-db">数据库文件：</label>
                        <input type="file" id="import-db" accept=".db,.sqlite">
                    </div>
                    <div>
                        <label for="import-pdfs">PDF 文件：</label>
                        <input type="file" id="import-pdfs" accept=".pdf,.png,.jpg,.jpeg" multiple>
                    </div>
                    <p class="hint">选择 SQLite 数据库文件（将覆盖现有数据），可选附加 PDF/图片</p>
                </div>
                <div id="import-status" role="status" aria-live="polite"></div>
            </div>
            <div class="modal-footer">
                <button id="btn-export-backup" class="btn-secondary" data-action="export-backup">📤 导出备份</button>
                <button id="btn-confirm-import" class="btn-primary" data-action="confirm-import">确认导入</button>
                <button class="btn-secondary close-btn">取消</button>
            </div>
        </div>
    </div>

    <!-- PDF/图片 查看弹窗 -->
    <div id="pdf-modal" class="modal" role="dialog" aria-labelledby="pdf-title">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="pdf-title">检查单</h3>
                <button class="close-btn" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body" id="file-viewer-container">
                <iframe id="pdf-viewer" frameborder="0" title="PDF 查看器"></iframe>
                <img id="img-viewer" style="display:none" alt="检查单图片">
            </div>
        </div>
    </div>

    <!-- 报告详情弹窗 -->
    <div id="report-modal" class="modal" role="dialog" aria-labelledby="report-title">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="report-title">报告详情</h3>
                <button class="close-btn" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body" id="report-detail"></div>
        </div>
    </div>

    <!-- Settings modal -->
    <div id="settings-modal" class="modal" role="dialog" aria-labelledby="settings-title">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="settings-title">设置</h3>
                <button class="close-btn" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h4>数据管理</h4>
                    <button class="btn btn-primary" data-action="export-backup">📤 导出备份</button>
                </div>
                <div class="settings-section">
                    <h4>关于</h4>
                    <p>Labtrace v1.0.0</p>
                    <p class="hint">离线医疗检验数据管理工具</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/database.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
